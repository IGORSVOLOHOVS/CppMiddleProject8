# Configure, build and run the test suite the way the dev container does.
#
# This is the awkward one: the tool is a libTooling program, so the build needs
# the LLVM and Clang *development* libraries at exactly the major version the
# dev container pins (20), not just a clang binary. Ubuntu 24.04 - which is
# what ubuntu-latest currently is - ships LLVM 19 at the newest, so the
# packages come from apt.llvm.org, which is the same place
# .devcontainer/Dockerfile's llvm-20/clang-20 packages come from. That is a
# supported archive with noble builds, so this is ordinary apt work rather than
# a heroic source build of LLVM.
#
# The job ends in `ctest`, and the tests are only registered because the top
# level calls enable_testing(); without it ctest prints "No tests were found"
# and still exits 0, which is the exact shape of a green run that proves
# nothing.
#
# scripts/check_before_push.py runs exactly these steps locally.

name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / GCC 15 / LLVM 20 / Debug
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # GCC 15 is what .devcontainer/Dockerfile installs; noble has no g++-15
      # in the archive, so the toolchain PPA supplies it. The apt attempt comes
      # first so the PPA drops out once the runner image ships GCC 15.
      - name: Install GCC 15
        run: |
          set -eux
          sudo apt-get update
          if ! sudo apt-get install -y --no-install-recommends g++-15 gcc-15; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends g++-15 gcc-15
          fi
          sudo apt-get install -y --no-install-recommends ccache
          g++-15 --version

      # llvm.sh is upstream's own installer for apt.llvm.org: it adds the
      # signing key and the llvm-toolchain-<codename>-20 archive. The explicit
      # package list afterwards is what this project actually links against -
      # ClangConfig.cmake and the clangTooling/clangBasic/clangASTMatchers
      # libraries - and mirrors the llvm-20/clang-20 lines of the Dockerfile.
      - name: Install LLVM and Clang 20 development libraries
        run: |
          set -eux
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y --no-install-recommends \
            llvm-20-dev libclang-20-dev libclang-cpp20-dev clang-tools-20
          test -f /usr/lib/llvm-20/lib/cmake/clang/ClangConfig.cmake
          test -d /usr/lib/llvm-20/include/llvm
          clang-20 --version

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-gcc15-llvm20-${{ github.sha }}
          restore-keys: |
            ccache-linux-gcc15-llvm20-

      # tests/CMakeLists.txt fetches googletest over the network. Caching the
      # download keeps a GitHub outage from turning into a red build here.
      - name: Restore the fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-${{ hashFiles('tests/CMakeLists.txt') }}
          restore-keys: |
            deps-linux-

      - name: Configure
        env:
          CC: gcc-15
          CXX: g++-15
        run: cmake --preset linux-default -D CMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset linux-default

      - name: Test
        run: ctest --preset linux-default
